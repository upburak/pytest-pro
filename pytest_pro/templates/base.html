<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}PyTest Pro{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="{{ url_for('static', filename='js/common.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/tracer.js') }}" defer></script>
{% block scripts %}{% endblock %}
</head>
<body>
<header class="topbar">
  <span class="brand"><span class="brand-mark" aria-hidden="true">py</span>{% block heading %}PyTest Pro{% endblock %}</span>
  <span class="topbar-sub">{% block subheading %}{% endblock %}</span>
  <span class="sp"></span>
  {% block header_right %}{% endblock %}
</header>

<main class="work">
{% block content %}{% endblock %}
</main>

{% block after_main %}{% endblock %}

<footer class="status">{% block status %}{% endblock %}<span class="sp"></span><span>PyTest Pro {{ version }}</span></footer>
</body>
</html>
